<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>APEX ULTRA V3 Terminal</title>
<style>
body{
background:#0b0f14;
color:#e6edf3;
font-family:Segoe UI,Arial;
margin:0;
overflow:hidden
}
#topbar{
height:42px;
background:#11161d;
display:flex;
align-items:center;
padding:0 12px;
font-weight:600
}
#main{
display:flex;
height:calc(100vh - 42px)
}
#chartArea{
flex:1;
background:#0b0f14;
position:relative
}
#chart{
width:100%;
height:100%
}
#side{
width:320px;
background:#0f141b;
border-left:1px solid #1f2933;
display:flex;
flex-direction:column
}
.panel{
padding:10px;
border-bottom:1px solid #1f2933
}
button{
background:#1f6feb;
border:none;
padding:6px 10px;
margin:2px;
border-radius:4px;
color:white;
cursor:pointer
}
button.sell{background:#d13d3d}
.order{
padding:6px;
border-bottom:1px solid #1f2933;
font-size:13px
}
.green{color:#3fb950}
.red{color:#f85149}
#orders{flex:1;overflow:auto}
</style>
</head>

<body>

<div id="topbar">
APEX ULTRA V3 TERMINAL
</div>

<div id="main">

<div id="chartArea">
<canvas id="chart"></canvas>
</div>

<div id="side">

<div class="panel">
<div>Quick Trade</div>
<button onclick="trade('LONG')">▲ BUY</button>
<button class="sell" onclick="trade('SHORT')">▼ SELL</button>
</div>

<div class="panel">
Balance: $<span id="balance">10000</span>
</div>

<div id="orders"></div>

</div>
</div>

<script>

const canvas=document.getElementById("chart")
const ctx=canvas.getContext("2d")

let W,H
function resize(){
W=canvas.clientWidth
H=canvas.clientHeight
canvas.width=W
canvas.height=H
}
window.addEventListener("resize",resize)
resize()

/* ======================
STATE
====================== */

const ST={
balance:10000,
orders:[],
candles:[]
}

/* ======================
PRICE SIMULATOR
====================== */

let price=100

function newCandle(){

let open=price
let high=open+Math.random()*2
let low=open-Math.random()*2
let close=low+Math.random()*(high-low)

price=close

ST.candles.push({open,high,low,close})

if(ST.candles.length>120)ST.candles.shift()

}

/* ======================
INDICATORS
====================== */

function EMA(data,len){

let k=2/(len+1)
let ema=data[0]

for(let i=1;i<data.length;i++){
ema=data[i]*k+ema*(1-k)
}

return ema

}

function RSI(data,len){

if(data.length<len)return 50

let gain=0
let loss=0

for(let i=data.length-len;i<data.length;i++){

let d=data[i]-data[i-1]

if(d>0)gain+=d
else loss-=d

}

let rs=gain/(loss||1)

return 100-(100/(1+rs))

}

/* ======================
TRADING
====================== */

function trade(side){

let entry=price

ST.orders.push({
side,
entry,
size:1,
id:Date.now()
})

renderOrders()

}

function closePosition(id){

let o=ST.orders.find(o=>o.id===id)

if(!o)return

let pnl=(price-o.entry)*(o.side==="LONG"?1:-1)

ST.balance+=pnl

ST.orders=ST.orders.filter(x=>x.id!==id)

updateBalance()
renderOrders()

}

function updateBalance(){
document.getElementById("balance").textContent=ST.balance.toFixed(2)
}

/* ======================
ORDER UI
====================== */

function renderOrders(){

const el=document.getElementById("orders")

el.innerHTML=ST.orders.map(o=>{

let pnl=(price-o.entry)*(o.side==="LONG"?1:-1)

return `
<div class="order">
<div>${o.side} @ ${o.entry.toFixed(2)}</div>
<div class="${pnl>=0?'green':'red'}">PNL ${pnl.toFixed(2)}</div>
<button onclick="closePosition(${o.id})">Close</button>
</div>
`

}).join("")

}

/* ======================
CHART
====================== */

function drawChart(){

ctx.clearRect(0,0,W,H)

let candles=ST.candles

if(candles.length===0)return

let max=Math.max(...candles.map(c=>c.high))
let min=Math.min(...candles.map(c=>c.low))

let scale=H/(max-min)

let cw=W/candles.length

candles.forEach((c,i)=>{

let x=i*cw

let openY=H-(c.open-min)*scale
let closeY=H-(c.close-min)*scale
let highY=H-(c.high-min)*scale
let lowY=H-(c.low-min)*scale

ctx.strokeStyle="white"
ctx.beginPath()
ctx.moveTo(x+cw/2,highY)
ctx.lineTo(x+cw/2,lowY)
ctx.stroke()

ctx.fillStyle=c.close>=c.open?"#3fb950":"#f85149"

ctx.fillRect(
x+cw*0.25,
Math.min(openY,closeY),
cw*0.5,
Math.abs(openY-closeY)
)

})

}

/* ======================
MAIN LOOP
====================== */

function loop(){

if(Math.random()<0.1)newCandle()

drawChart()
renderOrders()

requestAnimationFrame(loop)

}

setInterval(newCandle,1200)

loop()

</script>

</body>
</html>
