<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>APEX ULTRA — OMNI SNIPER TERMINAL</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#010306;--bg1:#030810;--bg2:#050c18;--bg3:#081222;
  --c:#00e5ff;--g:#00ff9d;--r:#ff2d55;--y:#ffd60a;--pu:#bf40ff;
  --t0:#ddeeff;--t1:#99bbcc;--t3:#2a4455;
  --glow-c:0 0 15px rgba(0,229,255,0.6);
  --font-mono:'JetBrains Mono',monospace;
  --font-disp:'Orbitron',sans-serif;
  --font-data:'Rajdhani',sans-serif;
}

/* GLOBAL RESET & ANIMATIONS */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body { 
  background: var(--bg0); color: var(--t0); font-family: var(--font-mono); 
  margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column;
}

@keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
@keyframes neonPulse { from { filter: brightness(1); } to { filter: brightness(1.5) drop-shadow(0 0 5px var(--c)); } }

/* SCANLINE OVERLAY */
body::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  z-index: 1000; background-size: 100% 2px, 3px 100%;
}

/* HEADER */
#hdr {
  height: 50px; background: var(--bg1); border-bottom: 1px solid rgba(0,229,255,0.2);
  display: flex; align-items: center; padding: 0 20px; justify-content: space-between;
}
.logo { font-family: var(--font-disp); font-size: 18px; letter-spacing: 4px; color: var(--c); text-shadow: var(--glow-c); }

/* MAIN TERMINAL LAYOUT */
#main { display: flex; flex: 1; overflow: hidden; }
#lp { width: 220px; background: var(--bg1); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
#center { flex: 1; display: flex; flex-direction: column; background: #010409; }
#rp { width: 300px; background: var(--bg1); border-left: 1px solid rgba(255,255,255,0.05); padding: 15px; }

/* OMNI SNIPER UI */
.sniper-panel { background: rgba(0,229,255,0.03); border: 1px solid rgba(0,229,255,0.1); border-radius: 4px; padding: 12px; margin-bottom: 15px; }
.sniper-title { font-family: var(--font-disp); font-size: 10px; color: var(--c); margin-bottom: 10px; display: flex; justify-content: space-between; }
.badge { font-size: 8px; padding: 2px 6px; border-radius: 2px; text-transform: uppercase; border: 1px solid; }
.badge.armed { color: var(--g); border-color: var(--g); background: rgba(0,255,157,0.15); animation: neonPulse 1s infinite alternate; }

/* CANDLESTICK CANVAS */
#cwrap { flex: 1; position: relative; }
#candleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }

/* STATS BAR */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.stat-box { background: var(--bg2); padding: 8px; border: 1px solid rgba(255,255,255,0.05); border-radius: 3px; }
.stat-l { font-size: 8px; color: var(--t3); text-transform: uppercase; }
.stat-v { font-family: var(--font-data); font-size: 14px; font-weight: bold; color: var(--t1); }
</style>
</head>
<body>

<header id="hdr">
  <div class="logo">APEX ULTRA OMNI</div>
  <div style="display:flex; gap:20px; align-items:center;">
    <div id="ticker" style="font-family:var(--font-disp); color:var(--g)">BTC/USD $54,120.42</div>
    <div id="ping-wrap" style="font-size:10px; color:var(--t3)">LATENCY: <span id="ping" style="color:var(--c)">12ms</span></div>
  </div>
</header>

<div id="main">
  <aside id="lp">
    <div style="padding:10px; font-size:10px; color:var(--t3); border-bottom:1px solid #111">TERMINAL WATCHLIST</div>
    <div id="watchlist" style="flex:1; overflow-y:auto"></div>
  </aside>

  <section id="center">
    <div id="cwrap">
      <canvas id="candleCanvas"></canvas>
    </div>
    <div style="height:30px; border-top:1px solid #111; display:flex; align-items:center; padding:0 15px; font-size:9px; color:var(--t3)">
      VOL: 42.1B | RSI: 64.2 | MACD: <span style="color:var(--g)">+12.4</span>
    </div>
  </section>

  <aside id="rp">
    <div class="sniper-panel">
      <div class="sniper-title">
        OMNI-SNIPER V4.0 
        <span class="badge armed">Armed</span>
      </div>
      <div style="font-size:11px; margin-bottom:10px;">Execution Strategy: <span style="color:var(--y)">QUANTUM_HFT</span></div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-l">Balance</div><div class="stat-v">$142,500</div></div>
        <div class="stat-box"><div class="stat-l">Open P&L</div><div class="stat-v" style="color:var(--g)">+$1,240</div></div>
      </div>
    </div>

    <div style="font-size:10px; color:var(--t3); margin-bottom:10px;">SNIPER PARAMETERS</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <label style="font-size:9px;">Sensitivity: <input type="range" style="width:100%"></label>
      <label style="font-size:9px;">Auto-Exit TP%: <input type="range" style="width:100%"></label>
    </div>

    <div id="order-log" style="margin-top:20px; border-top:1px solid #222; padding-top:10px;">
      <div style="font-size:9px; color:var(--t3)">LIVE SNIPER LOG:</div>
      <div id="logs" style="font-size:8px; color:var(--t1); margin-top:5px; height:200px; overflow:hidden;"></div>
    </div>
  </aside>
</div>

<script>
const canvas = document.getElementById('candleCanvas');
const ctx = canvas.getContext('2d');
const logEl = document.getElementById('logs');
let width, height;
let candles = [];

// CANDLESTICK INITIALIZATION
function initData() {
    let lastClose = 54000;
    for(let i=0; i<80; i++) {
        let open = lastClose;
        let close = open + (Math.random() - 0.5) * 300;
        let high = Math.max(open, close) + Math.random() * 80;
        let low = Math.min(open, close) - Math.random() * 80;
        candles.push({open, high, low, close});
        lastClose = close;
    }
}

function resize() {
    width = canvas.width = canvas.parentElement.offsetWidth;
    height = canvas.height = canvas.parentElement.offsetHeight;
    render();
}

function render() {
    ctx.clearRect(0, 0, width, height);
    
    // Grid Lines
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.05)';
    ctx.lineWidth = 1;
    for(let i=0; i<height; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke(); }

    const candleWidth = (width / candles.length) * 0.8;
    const spacing = (width / candles.length);
    const scale = 2; // Price scaling factor

    candles.forEach((c, i) => {
        const x = i * spacing;
        const isBull = c.close >= c.open;
        const color = isBull ? '#00ff9d' : '#ff2d55';
        
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        
        // Draw Wick
        ctx.beginPath();
        ctx.moveTo(x + candleWidth/2, height - (c.high - 53000) * scale);
        ctx.lineTo(x + candleWidth/2, height - (c.low - 53000) * scale);
        ctx.stroke();
        
        // Draw Body
        const bodyTop = height - (Math.max(c.open, c.close) - 53000) * scale;
        const bodyHeight = Math.max(1, Math.abs(c.open - c.close) * scale);
        
        if (isBull) {
            ctx.globalAlpha = 0.3;
            ctx.fillRect(x, bodyTop, candleWidth, bodyHeight);
            ctx.globalAlpha = 1.0;
            ctx.strokeRect(x, bodyTop, candleWidth, bodyHeight);
        } else {
            ctx.fillRect(x, bodyTop, candleWidth, bodyHeight);
        }
    });
}

// OMNI SNIPER EXECUTION ENGINE
function startSniperEngine() {
    setInterval(() => {
        // Update Price
        const last = candles[candles.length - 1];
        const move = (Math.random() - 0.5) * 40;
        last.close += move;
        if(last.close > last.high) last.high = last.close;
        if(last.close < last.low) last.low = last.close;

        // UI Updates
        document.getElementById('ticker').innerText = `BTC/USD $${last.close.toFixed(2)}`;
        document.getElementById('ping').innerText = `${Math.floor(Math.random()*8 + 4)}ms`;
        
        // Random "Snipe" Log
        if(Math.random() > 0.98) {
            const entry = last.close.toFixed(2);
            const side = Math.random() > 0.5 ? 'BUY' : 'SELL';
            const logColor = side === 'BUY' ? 'var(--g)' : 'var(--r)';
            const entryLog = document.createElement('div');
            entryLog.innerHTML = `[${new Date().toLocaleTimeString()}] <span style="color:${logColor}">${side} EXECUTED</span> @ $${entry}`;
            logEl.prepend(entryLog);
        }

        render();
    }, 100);
}

// START TERMINAL
window.addEventListener('resize', resize);
initData();
resize();
startSniperEngine();

</script>
</body>
</html>
